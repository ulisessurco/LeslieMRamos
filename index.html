<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Pantalla de inicio para permitir el reproductor automático */
        #pantalla-inicio {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #pantalla-inicio h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        #pantalla-inicio p {
            font-size: 1rem;
            opacity: 0.8;
            animation: parpadeo 1.5s infinite alternate;
        }

        @keyframes parpadeo {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        /* Marco de la tarjeta vertical (9:16) */
        .card-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 56.25vh;
            max-height: 177.77vw;
            overflow: hidden;
            background-color: #333;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .fondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .flor-animada {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 68%;
            z-index: 2;
            transform-origin: bottom center;
            animation: viento 4s ease-in-out infinite alternate;
        }

        @keyframes viento {
            0% {
                transform: translateX(-50%) rotate(0deg) skewX(0deg);
            }
            50% {
                transform: translateX(-50%) rotate(2.5deg) skewX(1.5deg);
            }
            100% {
                transform: translateX(-50%) rotate(-2deg) skewX(-1.5deg);
            }
        }

        .contenido {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 50px 20px 30px 20px;
            text-align: center;
        }

        .texto {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9), 0 0 15px rgba(255, 215, 0, 0.6);
            animation: flotar 3s ease-in-out infinite alternate;
        }

        @keyframes flotar {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        .btn-musica {
            background: rgba(255, 255, 255, 0.9);
            color: #111;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }

        .btn-musica:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Capa que requiere un toque inicial para reproducir la música -->
    <div id="pantalla-inicio" onclick="iniciarExperiencia()">
        <h2>Toca la pantalla para abrir ❤️</h2>
        <p>(Se reproducirá música)</p>
    </div>

    <div class="card-frame">
        <img src="fondo.jpg" class="fondo" alt="Fondo Minecraft">
        <img src="flor.png" class="flor-animada" alt="Flor Minecraft">

        <div class="contenido">
            <h1 class="texto">te amo mucho &lt;3</h1>
            <button class="btn-musica" onclick="toggleMusica()" id="btnAudio">🎶 Pausar música</button>
        </div>
    </div>

    <audio id="musica" loop preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <script>
        function iniciarExperiencia() {
            var audio = document.getElementById("musica");
            var pantalla = document.getElementById("pantalla-inicio");

            // Intenta reproducir el audio inmediatamente tras el clic
            audio.play().then(() => {
                // Si el audio inicia con éxito, oculta el mensaje
                pantalla.style.display = "none";
            }).catch(error => {
                console.log("Error al reproducir audio:", error);
                pantalla.style.display = "none";
            });
        }

        function toggleMusica() {
            var audio = document.getElementById("musica");
            var btn = document.getElementById("btnAudio");

            if (audio.paused) {
                audio.play();
                btn.innerHTML = "🎶 Pausar música";
            } else {
                audio.pause();
                btn.innerHTML = "🎵 Reproducir música";
            }
        }
    </script>
</body>
</html>
